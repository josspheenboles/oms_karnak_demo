services:
  app:
    build:
      context: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      # مطلوب على Linux: يجعل host.docker.internal يشير إلى الهوست
      # حيث يعمل Ollama (لا توجد خدمة ollama داخل هذا الملف).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
